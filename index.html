<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Lab</title>
<meta name="description" content="Studi di explanatory design su dati e ricerca medica: un contenuto, più stili.">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1c1b19;
    --muted: #6b6862;
    --line: #e4e1da;
    --card: #ffffff;
    --accent: #c4512b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514;
      --fg: #eceae5;
      --muted: #9a968e;
      --line: #2c2a27;
      --card: #1e1d1b;
      --accent: #e0774f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 40px; max-width: 56ch; }
  .loop {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 48px; padding: 0; list-style: none;
    font-size: 0.875rem; color: var(--muted);
  }
  .loop li { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 16px; }
  .grid { display: grid; gap: 12px; }
  .card {
    display: block; padding: 16px 18px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card strong { display: block; }
  .card span { color: var(--muted); font-size: 0.9rem; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Design Lab</h1>
  <p class="lede">Studi di explanatory design su dati e ricerca medica. Ogni studio prende un contenuto e lo realizza in più stili, per capire cosa fa il design quando il contenuto resta fermo.</p>
  <ul class="loop" aria-label="Metodo">
    <li>1 · See</li><li>2 · Name</li><li>3 · Copy</li><li>4 · Vary</li>
  </ul>
  <h2>Studi</h2>
  <div class="grid" id="studi"><p class="empty">Nessuno studio ancora. Il primo arriva presto.</p></div>
</main>
<script>
  // Per aggiungere uno studio: aggiungi una voce in articoli/index.json
  // { "titolo": "...", "descrizione": "...", "path": "articoli/<nome>/" }
  fetch('articoli/index.json')
    .then(r => r.ok ? r.json() : [])
    .then(studi => {
      if (!studi.length) return;
      const el = document.getElementById('studi');
      el.innerHTML = '';
      for (const s of studi) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = s.path;
        const t = document.createElement('strong'); t.textContent = s.titolo;
        const d = document.createElement('span'); d.textContent = s.descrizione || '';
        a.append(t, d);
        el.append(a);
      }
    })
    .catch(() => {});
</script>
</body>
</html>
